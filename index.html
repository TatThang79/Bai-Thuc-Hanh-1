
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website đầu tiên</title>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>My Website</h1>

        <nav>
            <ul>
                <li><a href="#home">Trang chủ</a></li>
                <li><a href="#about">Giới thiệu</a></li>
                <li><a href="#contact">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN -->
    <main>
        <section id="home">
            <h2>Chào mừng đến với website</h2>
            <p>Đây là trang web HTML đầu tiên của tôi.</p>

            <img
                src="https://picsum.photos/600/300"
                alt="Hình ảnh minh họa"
            >
        </section>

        <section id="about">
            <h2>Giới thiệu</h2>
            <p>Tôi đang học lập trình HTML.</p>
        </section>

        <section id="contact">
            <h2>Liên hệ</h2>
            <p>Email: example@gmail.com</p>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
